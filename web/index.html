<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SSH 승인 · Approval Portal</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f6fa;--surface:#fff;--ink:#17233b;--muted:#637089;--line:#e2e7ef;--accent:#315be8;--soft:#edf2ff;--code:#f5f7fb;--green:#18784c;--amber:#9c610a;--red:#bf374b;--shadow:0 8px 28px #17233b06}
    *{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.6}button,input,summary{outline-offset:4px}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent)}[hidden]{display:none!important}
    .shell{max-width:1240px;margin:auto;padding:44px 32px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px;font-weight:700}.mark{display:grid;place-items:center;width:38px;height:38px;background:var(--ink);color:var(--surface);border-radius:12px;font:700 19px ui-monospace,monospace}.connection{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.connection.connected .dot{background:var(--green)}
    .account{display:flex;align-items:center;gap:14px}.topbar{flex-wrap:wrap}.intro{margin:40px 0 28px}.eyebrow{margin:0 0 8px;color:var(--accent);font-size:11px;font-weight:750;letter-spacing:.16em}h1{margin:0;font-size:clamp(27px,4vw,38px);letter-spacing:-.055em;line-height:1.3}.subtitle{margin:12px 0 0;color:var(--muted)}
    .auth{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 24px;border:1px solid var(--line);background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}.auth-label{font-weight:650}.auth-note{margin:3px 0 0;color:var(--muted);font-size:12px}.auth-controls{display:flex;gap:10px;flex:0 1 470px}input{min-width:0;flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}.primary,.secondary{padding:10px 17px;border-radius:10px;font-weight:650;white-space:nowrap}.primary{border:1px solid var(--accent);background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:var(--surface);color:var(--ink)}.reject{color:var(--red)}
    .error{margin:12px 0 0;padding:11px 15px;border:1px solid var(--red);border-radius:10px;color:var(--red);background:var(--surface)}.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;margin-top:32px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}h2{margin:0;font-size:17px;letter-spacing:-.025em}.count{display:inline-grid;place-items:center;min-width:25px;height:25px;margin-left:8px;padding:0 7px;border-radius:8px;background:var(--soft);color:var(--accent);font-size:12px;vertical-align:middle}.section-note{font-size:12px;color:var(--muted)}
    .empty{padding:45px 24px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);background:var(--surface)}.empty strong{display:block;margin:10px 0 5px;color:var(--ink);font-size:14px;font-weight:600}.empty p{margin:0;font-size:12px}.empty-mark{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:19px}
    .request{padding:20px;margin-bottom:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}.request-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.kind{font-size:14px;font-weight:700}.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:650;background:var(--soft);color:var(--accent);white-space:nowrap}.badge.pending{background:#fff3dd;color:var(--amber)}.badge.completed{background:#e7f5ed;color:var(--green)}.badge.failed,.badge.denied{background:#fff0f1;color:var(--red)}.badge.expired{background:var(--bg);color:var(--muted)}.target{margin:10px 0 12px;color:var(--muted);font:12px ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}
    pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.8 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}.command,.output{padding:15px;border:1px solid var(--line);border-radius:10px;background:var(--code);max-height:360px;overflow:auto}.meta{display:flex;justify-content:space-between;gap:10px;margin-top:12px;color:var(--muted);font-size:11px;flex-wrap:wrap}.request-id{overflow-wrap:anywhere;font-family:ui-monospace,monospace}.actions{display:flex;gap:8px;margin-top:17px}.actions .primary{flex:1}.output-label{margin:16px 0 7px;font-size:12px;font-weight:650}.history-item{padding:0;overflow:hidden}.history-item summary{padding:17px 20px;cursor:pointer;list-style:none}.history-item summary::-webkit-details-marker{display:none}.summary-head{display:flex;align-items:center;gap:10px}.summary-head .badge{margin-left:auto}.chevron{color:var(--muted);transition:transform .15s}.history-item[open] .chevron{transform:rotate(90deg)}.preview{display:block;margin-top:8px;color:var(--muted);font:12px/1.6 ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-body{padding:0 20px 20px;border-top:1px solid var(--line)}.history-body .target{margin-top:14px}.footer{margin:24px 0 0;color:var(--muted);font-size:11px;text-align:right}
    @media(max-width:820px){.shell{padding:24px 18px 36px}.intro{margin-top:32px}.auth{align-items:stretch;flex-direction:column;gap:14px;padding:18px}.auth-controls{flex:auto}.grid{grid-template-columns:minmax(0,1fr);gap:25px}.section-note{font-size:11px}.brand{font-size:13px}.connection{font-size:11px}}
    @media(prefers-color-scheme:dark){:root{--bg:#111722;--surface:#192130;--ink:#e5ebf6;--muted:#9ba9c0;--line:#2c374a;--accent:#7f9aff;--soft:#27344e;--code:#131b29;--green:#72d4a2;--amber:#f2c272;--red:#ff99a7;--shadow:none}.primary{background:#466ae8;border-color:#466ae8}.badge.pending{background:#3b3020}.badge.completed{background:#20392e}.badge.failed,.badge.denied{background:#3b2630}}
  </style>
</head>
<body data-auth-mode="token">
  <main class="shell">
    <header class="topbar"><div class="brand"><span class="mark" aria-hidden="true">›_</span>SSH Approval Portal</div><div class="account"><div id="connection" class="connection"><span class="dot" aria-hidden="true"></span><span id="connection-text" data-en="Not connected">연결 전</span></div><button id="logout" class="secondary" hidden data-en="Sign out">로그아웃</button></div></header>
    <div class="intro">
    <label id="target-filter-label" hidden><span data-en="Target server">대상 서버</span> <select id="target-filter" aria-label="대상 서버"></select></label>
    <p id="server-identity" class="target" aria-label="서버 식별"></p><p class="eyebrow" data-en="SERVER OPERATIONS">서버 작업 승인</p><h1 data-en="SSH approvals and execution">SSH 승인·실행</h1><p class="subtitle" data-en="Review commands and file transfers. Each approved request runs once.">명령과 파일 전송 내용을 확인하세요. 승인한 요청은 한 번만 실행됩니다.</p></div>
    <div class="auth"><div><label id="auth-label" class="auth-label" for="token" data-en="Administrator connection">관리자 연결</label><p id="auth-note" class="auth-note" data-en="Enter your administrator token to view requests.">관리자 토큰으로 요청 목록을 조회합니다.</p></div><div class="auth-controls"><input id="token" type="password" placeholder="관리자 토큰" aria-label="관리자 토큰" autocomplete="off" spellcheck="false"><button id="load" class="primary" data-en="Refresh requests">요청 조회</button><a id="sign-in" href="/" hidden data-en="Sign in again">다시 로그인</a></div></div>
    <p id="error" class="error" role="alert" hidden></p>
    <div class="grid">
      <section aria-labelledby="pending-heading"><div class="section-head"><h2 id="pending-heading"><span data-en="Pending approvals">승인 대기목록</span><span id="pending-count" class="count">0</span></h2><span class="section-note" data-en="Nothing runs before approval">승인 전에는 실행되지 않습니다</span></div><div id="jobs"></div></section>
      <section aria-labelledby="history-heading"><div class="section-head"><h2 id="history-heading"><span data-en="Approval history">승인 이력</span><span id="history-count" class="count">0</span></h2><span class="section-note" data-en="Expand to view results">펼쳐서 결과 확인</span></div><div id="history"></div><p class="auth-note" data-en="Results remain for one hour after completion and are cleared on restart.">완료 후 1시간 동안 표시됩니다. 서버 재시작 시 초기화됩니다.</p></section>
    </div>
    <p id="updated" class="footer" data-en="Requests refresh automatically after connecting.">연결 후 목록이 자동으로 갱신됩니다.</p>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
