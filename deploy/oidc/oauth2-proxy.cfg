# Replace the public issuer, client ID and callback before use.
# Secrets are administrator-owned files, not command-line or environment values.
provider = "oidc"
oidc_issuer_url = "https://idp.example.com/realms/portal"
client_id = "portal-client"
redirect_url = "https://approve.example.com/oauth2/callback"
client_secret_file = "/etc/ssh-portal-oidc/client-secret"
cookie_secret_file = "/etc/ssh-portal-oidc/cookie-secret"
authenticated_emails_file = "/etc/ssh-portal-oidc/owners"

http_address = "127.0.0.1:4180"
upstreams = ["http://127.0.0.1:39125/"]
reverse_proxy = true
pass_host_header = true
pass_authorization_header = true
pass_basic_auth = false
skip_auth_strip_headers = true
skip_jwt_bearer_tokens = false
scope = "openid email"
code_challenge_method = "S256"
insecure_oidc_skip_nonce = false
insecure_oidc_skip_issuer_verification = false
insecure_oidc_allow_unverified_email = false
skip_claims_from_profile_url = true

cookie_name = "__Host-ssh-portal"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
cookie_csrf_per_request = true
cookie_expire = "1h"
standard_logging = false
request_logging = false
auth_logging = false
