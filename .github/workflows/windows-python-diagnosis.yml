name: Windows Python 기준판 비교 진단

on:
  workflow_dispatch:
  push:
    branches: [feat/deploy-1.8.0-20261101]
    paths:
      - .github/workflows/windows-python-diagnosis.yml
      - test/windows-python-diagnosis.ps1

permissions:
  contents: read

jobs:
  diagnosis:
    name: 같은 Windows VM에서 기준판과 후보 원인 판별
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: 현재 후보 고정
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - name: 기준판 1.7.0 고정
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c437e62157ed501a5029632d084a24d030902ca
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: 기존 제한을 유지한 기준판·후보와 수명 대조
        shell: pwsh
        run: |
          ./candidate/test/windows-python-diagnosis.ps1 -BaselineRoot "$env:GITHUB_WORKSPACE/baseline" -CandidateRoot "$env:GITHUB_WORKSPACE/candidate" -EvidenceRoot "$env:RUNNER_TEMP/windows-python-diagnosis"
      - name: 성공·실패 원자료 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-python-diagnosis-${{ github.sha }}
          path: ${{ runner.temp }}/windows-python-diagnosis
          if-no-files-found: error
          retention-days: 7
