name: Linux regression

on:
  push:
    branches: [fix/jev-binary-assessment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Python regression (non-root)
        shell: bash
        run: |
          set -euo pipefail
          for test in test/test_*.py; do
            if [[ "$test" != test/test_env_editor_lock.py ]]; then
              python3 -B "$test"
            fi
          done
