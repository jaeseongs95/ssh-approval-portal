name: Linux regression

on:
  push:
    branches: [fix/jev-binary-assessment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Node regression
        run: node --test --test-skip-pattern='^CLI-LOOPBACK exact helper executes inspection/status over pinned SSH and preserves authentication bytes$' test/*.test.mjs
      - name: Isolated CLI loopback fixture
        shell: bash
        run: |
          set -euo pipefail
          if getent passwd 10001 || getent group 10001 || [[ -e /tmp/cli-fixture-home ]]; then
            echo 'Fixture identity or home already exists' >&2
            exit 1
          fi
          sudo groupadd --gid 10001 sshclitest
          sudo useradd --system --uid 10001 --gid 10001 --home-dir /tmp/cli-fixture-home --shell /usr/sbin/nologin sshclitest
          sudo install -d -m 700 -o 10001 -g 10001 /tmp/cli-fixture-home /tmp/cli-fixture-source
          sudo cp -a "$GITHUB_WORKSPACE/." /tmp/cli-fixture-source/
          sudo chown -R 10001:10001 /tmp/cli-fixture-source
          cd /tmp/cli-fixture-source
          sudo -u sshclitest env HOME=/tmp/cli-fixture-home PATH="$PATH" node --test --test-name-pattern='^CLI-LOOPBACK exact helper executes inspection/status over pinned SSH and preserves authentication bytes$' test/agent-cli-delivery.test.mjs
      - name: Python regression (non-root)
        shell: bash
        run: |
          set -euo pipefail
          for test in test/test_*.py; do
            if [[ "$test" != test/test_env_editor_lock.py ]]; then
              python3 -B "$test"
            fi
          done
      - name: Isolated Linux rollout contracts
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum test/rollout-fixture/{bootstrap.py,run_linux.py,controller.py,linux_adapter.py,protected_state.py,scope_guard.py,staging_guard.py,offline-baseline.mjs,maintenance-request.mjs,test_linux_systemd.py}
          cd test/rollout-fixture
          python3 -B -m unittest -v test_controller test_protected_state test_linux_adapter test_scope_guard
          node test-maintenance.mjs
          node test-maintenance-cli.mjs
      - name: Isolated real systemd and helper fixture
        shell: bash
        run: |
          set -euo pipefail
          [[ -d /run/systemd/system ]] || { echo 'SYSTEMD_UNAVAILABLE: no systemd runtime' >&2; exit 1; }
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || exit 1
          unit="ssh-rollout-fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          state=$(sudo systemctl show "$unit" -p LoadState --value)
          [[ "$state" == not-found ]] || { echo 'fixture unit already exists' >&2; exit 1; }
          cleanup() { sudo systemctl stop "$unit" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          sudo systemd-run --unit="$unit" --property=Type=simple /usr/bin/sleep 120
          cd test/rollout-fixture
          sudo env SSH_ROLLOUT_FIXTURE_UNIT="$unit" /usr/bin/python3 -B -m unittest -v test_linux_systemd test_bootstrap
      - name: Isolated legacy to current systemd transition
        shell: bash
        run: |
          set -euo pipefail
          [[ -d /run/systemd/system ]] || { echo 'SYSTEMD_UNAVAILABLE' >&2; exit 1; }
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || exit 1
          old=$(mktemp -d /tmp/ssh-rollout-old.XXXXXXXX)
          data=$(mktemp -d /tmp/ssh-rollout-data.XXXXXXXX)
          trap 'sudo rm -rf -- "$old" "$data"' EXIT
          git fetch --no-tags --depth=1 origin 9644117aa904bcf6a6fd861b741942db3d42035c
          git archive 9644117aa904bcf6a6fd861b741942db3d42035c | tar -x -C "$old"
          cp -a node_modules "$old/node_modules"
          node_path=$(command -v node)
          unit="ssh-rollout-fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-transition.service"
          cd test/rollout-fixture
          sudo env SSH_ROLLOUT_FIXTURE_UNIT="$unit" SSH_E2E_OLD="$old" SSH_E2E_NEW="$GITHUB_WORKSPACE" SSH_E2E_NODE="$node_path" SSH_E2E_DIR="$data" /usr/bin/python3 -B -m unittest -v test_transition_e2e
