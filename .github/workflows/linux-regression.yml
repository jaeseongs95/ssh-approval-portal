name: Linux regression

on:
  push:
    branches: [fix/jev-binary-assessment, feat/windows-full-support-20261101, feat/admin-ui-1.6.8-20261101, fix/request-admission-queue-20261102, fix/agent-portability-20261102, fix/multiline-commands-20261102, fix/agent-file-discovery-20261102, fix/upload-capability-20261103]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    name: browser-${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts
      - name: 브라우저 의존 패키지 저장소 연결 진단
        shell: bash
        run: |
          set -u
          . /etc/os-release
          for host in azure.archive.ubuntu.com archive.ubuntu.com; do
            timeout 10s getent ahosts "$host" || true
            for scheme in http https; do
              curl --silent --show-error --output /dev/null --range 0-0 \
                --connect-timeout 5 --max-time 10 \
                --write-out "저장소=$scheme://$host 상태=%{http_code} 원격주소=%{remote_ip} 연결초=%{time_connect} 전체초=%{time_total}\n" \
                "$scheme://$host/ubuntu/dists/$VERSION_CODENAME/InRelease" || true
            done
          done
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: 관리자 화면 회귀 시험
        run: node test/browser/run.mjs ${{ matrix.browser }}
        env:
          UI_TEST_RESULTS: ${{ runner.temp }}/admin-ui-results
      - name: 관리자 화면 시험 결과와 화면갈무리 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-ui-results-${{ matrix.browser }}
          path: ${{ runner.temp }}/admin-ui-results
          if-no-files-found: warn
          retention-days: 7
  compose-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Test durable Compose image replacement
        run: bash test/compose-update-ci.sh
  linux-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts
      - name: Node regression
        run: node --test --test-skip-pattern='^CLI-LOOPBACK exact helper executes inspection/status over pinned SSH and preserves authentication bytes$' test/*.test.mjs
      - name: Test-mode file path regression detects the previous boundary
        shell: bash
        run: |
          set -euo pipefail
          path=src/adapters/ssh/transfers.mjs
          cp "$path" "$RUNNER_TEMP/testmode-transfers-final.mjs"
          restore_testmode_transfer() { cp "$RUNNER_TEMP/testmode-transfers-final.mjs" "$path"; }
          trap restore_testmode_transfer EXIT
          git show bef841dd94625983fa8ae5a27d6ed1e9af143e9f:"$path" > "$path"
          set +e
          node --test --test-reporter=tap test/test-mode-file-path-policy.test.mjs > "$RUNNER_TEMP/testmode-path-red.tap" 2>&1
          red=$?
          set -e
          cat "$RUNNER_TEMP/testmode-path-red.tap"
          test "$red" -ne 0
          grep -Eq '^# fail [1-9][0-9]*$' "$RUNNER_TEMP/testmode-path-red.tap"
          restore_testmode_transfer
          node --test --test-reporter=tap test/test-mode-file-path-policy.test.mjs
          node --test --test-reporter=tap test/test-mode-file-policy-application.test.mjs
      - name: Remote JSON upload detects missing provider-neutral transport
        shell: bash
        run: |
          set -euo pipefail
          paths=(src/adapters/mcp/server.mjs src/adapters/storage/artifacts.mjs src/application/files.mjs src/application/target-router.mjs)
          for i in "${!paths[@]}"; do cp "${paths[$i]}" "$RUNNER_TEMP/remote-upload-$i.mjs"; done
          restore_remote_upload() {
            for i in "${!paths[@]}"; do cp "$RUNNER_TEMP/remote-upload-$i.mjs" "${paths[$i]}"; done
          }
          trap restore_remote_upload EXIT
          for path in "${paths[@]}"; do git show afe59704082d5b8cd7daedae524e209d5bc53e94:"$path" > "$path"; done
          red_exit=0
          node --test --test-reporter=tap --test-name-pattern='^REMOTE-JSON schemas|^REMOTE-JSON real binary|^REMOTE-JSON simultaneous' test/remote-mcp-upload.test.mjs > "$RUNNER_TEMP/remote-upload-red.log" 2>&1 || red_exit=$?
          cat "$RUNNER_TEMP/remote-upload-red.log"
          test "$red_exit" -ne 0
          grep -q '^# fail 3$' "$RUNNER_TEMP/remote-upload-red.log"
          grep -q 'begin-upload must be available\|Tool begin-upload not found' "$RUNNER_TEMP/remote-upload-red.log"
          restore_remote_upload
          node --test --test-reporter=tap --test-name-pattern='^REMOTE-JSON schemas|^REMOTE-JSON real binary|^REMOTE-JSON simultaneous' test/remote-mcp-upload.test.mjs
      - name: File selection detects the original Windows and error-code defects
        shell: bash
        run: |
          set -euo pipefail
          cp src/adapters/cli/agent-file-forwarder.mjs "$RUNNER_TEMP/selector-fixed.mjs"
          cp scripts/portal-file-mcp.mjs "$RUNNER_TEMP/file-mcp-fixed.mjs"
          restore() {
            cp "$RUNNER_TEMP/selector-fixed.mjs" src/adapters/cli/agent-file-forwarder.mjs
            cp "$RUNNER_TEMP/file-mcp-fixed.mjs" scripts/portal-file-mcp.mjs
          }
          trap restore EXIT
          for path in src/adapters/cli/agent-file-forwarder.mjs scripts/portal-file-mcp.mjs; do
            git show 4b0beab286366474526883c37cecc7d810b49287:"$path" > "$path"
          done
          red_exit=0
          node --test --test-reporter=tap --test-name-pattern='^WINDOWS-SELECTION|^SDK-WINDOWS|^SDK-REFUSAL|^SDK-ERROR-CODES' test/agent-file-forwarder.test.mjs test/agent-file-mcp-process.test.mjs > "$RUNNER_TEMP/file-selector-red.log" 2>&1 || red_exit=$?
          cat "$RUNNER_TEMP/file-selector-red.log"
          test "$red_exit" -ne 0
          grep -q '^# fail 4$' "$RUNNER_TEMP/file-selector-red.log"
          restore
          node --test --test-reporter=tap test/agent-file-forwarder.test.mjs test/agent-file-mcp-process.test.mjs test/portal-file-forwarder.test.mjs test/portal-file-mcp-process.test.mjs
      - name: Multiline regression rejects pre-fix source
        shell: bash
        run: |
          set -euo pipefail
          restore() {
            cp "$RUNNER_TEMP/validation.multiline-current.mjs" src/domain/validation.mjs
            cp "$RUNNER_TEMP/target-platform.multiline-current.mjs" src/domain/target-platform.mjs
            cp "$RUNNER_TEMP/approval-queue.multiline-current.mjs" src/domain/approval-queue.mjs
          }
          cp src/domain/validation.mjs "$RUNNER_TEMP/validation.multiline-current.mjs"
          cp src/domain/target-platform.mjs "$RUNNER_TEMP/target-platform.multiline-current.mjs"
          cp src/domain/approval-queue.mjs "$RUNNER_TEMP/approval-queue.multiline-current.mjs"
          trap restore EXIT
          for path in src/domain/validation.mjs src/domain/target-platform.mjs; do
            git show 6b90681d135bee5c12338ea0449eae5861d0ae0f:"$path" > "$path"
          done
          if node --test --test-reporter=tap --test-name-pattern='^ML-INPUT accepts' test/multiline-commands.test.mjs > "$RUNNER_TEMP/multiline-red.log" 2>&1; then
            cat "$RUNNER_TEMP/multiline-red.log"
            echo 'Expected pre-fix multiline rejection was not observed' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/multiline-red.log"
          grep -q '^# fail 1$' "$RUNNER_TEMP/multiline-red.log"
          restore
          git show 6b90681d135bee5c12338ea0449eae5861d0ae0f:src/domain/approval-queue.mjs > src/domain/approval-queue.mjs
          if node --test --test-reporter=tap --test-name-pattern='^expiry wake before' test/approval-callback.test.mjs > "$RUNNER_TEMP/approval-expiry-red.log" 2>&1; then
            cat "$RUNNER_TEMP/approval-expiry-red.log"
            echo 'Expected pre-fix early expiry timeout was not observed' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/approval-expiry-red.log"
          grep -q '^# fail 1$' "$RUNNER_TEMP/approval-expiry-red.log"
      - name: Cross-dialect setup regression rejects the previous source
        shell: bash
        run: |
          set -euo pipefail
          schema_state() {
            printf 'schema_dialect_%s_at=%s\n' "$1" "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            sha256sum src/adapters/mcp/client-setup.mjs test/mcp-contracts.test.mjs
          }
          cp src/adapters/mcp/client-setup.mjs "$RUNNER_TEMP/client-setup.dialect-current.mjs"
          trap 'cp "$RUNNER_TEMP/client-setup.dialect-current.mjs" src/adapters/mcp/client-setup.mjs' EXIT
          git show 59095c63ea9ac4961553a5c8acc768305b55d99a:src/adapters/mcp/client-setup.mjs > src/adapters/mcp/client-setup.mjs
          schema_state red_started
          red_exit=0
          node --test --test-reporter=tap --test-name-pattern='^SDK-published MCP schemas compile' test/mcp-contracts.test.mjs > "$RUNNER_TEMP/client-setup-dialect-red.log" 2>&1 || red_exit=$?
          schema_state red_finished
          cat "$RUNNER_TEMP/client-setup-dialect-red.log"
          printf 'schema_dialect_red_exit=%s\n' "$red_exit"
          if [[ "$red_exit" -eq 0 ]]; then
            echo 'Expected pre-fix tuple schema incompatibility was not observed' >&2
            exit 1
          fi
          grep -q '^# fail 1$' "$RUNNER_TEMP/client-setup-dialect-red.log"
          grep -q 'get-client-setup.outputSchema 2020-12' "$RUNNER_TEMP/client-setup-dialect-red.log"
          cp "$RUNNER_TEMP/client-setup.dialect-current.mjs" src/adapters/mcp/client-setup.mjs
          schema_state green_started
          green_exit=0
          node --test --test-reporter=tap --test-name-pattern='^SDK-published MCP schemas compile' test/mcp-contracts.test.mjs > "$RUNNER_TEMP/client-setup-dialect-green.log" 2>&1 || green_exit=$?
          schema_state green_finished
          cat "$RUNNER_TEMP/client-setup-dialect-green.log"
          printf 'schema_dialect_green_exit=%s\n' "$green_exit"
          test "$green_exit" -eq 0
          grep -q '^# tests 1$' "$RUNNER_TEMP/client-setup-dialect-green.log"
          grep -q '^# pass 1$' "$RUNNER_TEMP/client-setup-dialect-green.log"
          grep -q '^# fail 0$' "$RUNNER_TEMP/client-setup-dialect-green.log"
      - name: Client setup regression rejects the previous source
        shell: bash
        run: |
          set -euo pipefail
          cp src/adapters/mcp/server.mjs "$RUNNER_TEMP/server.discovery-current.mjs"
          trap 'cp "$RUNNER_TEMP/server.discovery-current.mjs" src/adapters/mcp/server.mjs' EXIT
          git show 56f6f717257341d989832d29add0172cbb50dd22:src/adapters/mcp/server.mjs > src/adapters/mcp/server.mjs
          if node --test --test-reporter=tap --test-name-pattern='^client setup chooses routes' test/mcp-contracts.test.mjs > "$RUNNER_TEMP/client-setup-red.log" 2>&1; then
            cat "$RUNNER_TEMP/client-setup-red.log"
            echo 'Expected missing client setup regression was not observed' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/client-setup-red.log"
          grep -q '^# fail 1$' "$RUNNER_TEMP/client-setup-red.log"
      - name: Session cleanup regression rejects the previous client
        shell: bash
        run: |
          set -euo pipefail
          cp src/adapters/cli/portal-client.mjs "$RUNNER_TEMP/portal-client.cleanup-current.mjs"
          trap 'cp "$RUNNER_TEMP/portal-client.cleanup-current.mjs" src/adapters/cli/portal-client.mjs' EXIT
          git show 7a56c77df42d67736b7eaf913a3bbe60b91a3e84:src/adapters/cli/portal-client.mjs > src/adapters/cli/portal-client.mjs
          if node --test --test-reporter=tap --test-name-pattern='^doctor reports OWNER_SESSION_CLEANUP_UNKNOWN when logout fails after an issued cookie and invalid body$' test/portal-client-discovery.test.mjs > "$RUNNER_TEMP/session-cleanup-red.log" 2>&1; then
            cat "$RUNNER_TEMP/session-cleanup-red.log"
            echo 'Expected missed cleanup failure was not observed' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/session-cleanup-red.log"
          grep -q '^# fail 1$' "$RUNNER_TEMP/session-cleanup-red.log"
      - name: Execution queue regression rejects pre-fix source
        shell: bash
        run: |
          set -euo pipefail
          cp src/domain/approval-queue.mjs "$RUNNER_TEMP/approval-queue.current.mjs"
          trap 'cp "$RUNNER_TEMP/approval-queue.current.mjs" src/domain/approval-queue.mjs' EXIT
          git show e7a13aea16a57b2657292562195ffe012f566cee:src/domain/approval-queue.mjs > src/domain/approval-queue.mjs
          if node --test --test-reporter=tap --test-name-pattern='^execution queue preserves per-target FIFO' test/execution-queue.test.mjs > "$RUNNER_TEMP/execution-queue-red.log" 2>&1; then
            cat "$RUNNER_TEMP/execution-queue-red.log"
            echo 'Expected pre-fix busy failure was not observed' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/execution-queue-red.log"
          grep -q '^# fail 1$' "$RUNNER_TEMP/execution-queue-red.log"
      - name: Agent portability regression rejects pre-fix source
        shell: bash
        run: |
          set -euo pipefail
          restore() {
            cp "$RUNNER_TEMP/portal-client.mjs.portability-current" scripts/portal-client.mjs
            cp "$RUNNER_TEMP/server.mjs.portability-current" src/adapters/mcp/server.mjs
          }
          cp scripts/portal-client.mjs "$RUNNER_TEMP/portal-client.mjs.portability-current"
          cp src/adapters/mcp/server.mjs "$RUNNER_TEMP/server.mjs.portability-current"
          trap restore EXIT
          for path in scripts/portal-client.mjs src/adapters/mcp/server.mjs; do
            git show cc0c8c075a1b598f99a7327531c829cdb88114f3:"$path" > "$path"
          done
          if node --test --test-reporter=tap --test-name-pattern='provider-neutral capabilities|text-only MCP consumers recover|CLI upload, resume and download accept' test/mcp-contracts.test.mjs test/cli-platform-paths.test.mjs > "$RUNNER_TEMP/agent-portability-red.log" 2>&1; then
            cat "$RUNNER_TEMP/agent-portability-red.log"
            echo 'Expected pre-fix regression failure was not observed' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/agent-portability-red.log"
          grep -q '^# fail 3$' "$RUNNER_TEMP/agent-portability-red.log"
      - name: Pre-fix SSH recovery regressions must fail
        run: bash test/ssh-recovery-red.sh
      - name: Preserve pre-fix regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ssh-recovery-red
          path: ${{ runner.temp }}/ssh-recovery-red-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Isolated CLI loopback fixture
        shell: bash
        run: |
          set -euo pipefail
          if getent passwd 10001 || getent group 10001 || [[ -e /tmp/cli-fixture-home ]]; then
            echo 'Fixture identity or home already exists' >&2
            exit 1
          fi
          sudo groupadd --gid 10001 sshclitest
          sudo useradd --system --uid 10001 --gid 10001 --home-dir /tmp/cli-fixture-home --shell /usr/sbin/nologin sshclitest
          sudo install -d -m 700 -o 10001 -g 10001 /tmp/cli-fixture-home /tmp/cli-fixture-source
          sudo cp -a "$GITHUB_WORKSPACE/." /tmp/cli-fixture-source/
          sudo chown -R 10001:10001 /tmp/cli-fixture-source
          cd /tmp/cli-fixture-source
          sudo -u sshclitest env HOME=/tmp/cli-fixture-home PATH="$PATH" node --test --test-name-pattern='^CLI-LOOPBACK exact helper executes inspection/status over pinned SSH and preserves authentication bytes$' test/agent-cli-delivery.test.mjs
      - name: Python regression (non-root)
        shell: bash
        run: |
          set -euo pipefail
          for test in test/test_*.py; do
            if [[ "$test" != test/test_env_editor_lock.py ]]; then
              python3 -B "$test"
            fi
          done
