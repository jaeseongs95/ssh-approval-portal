<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSH 승인 및 파일 전송</title><style>
:root{color-scheme:light dark;--surface:var(--color-background-primary,#fff);--soft:var(--color-background-secondary,#f6f8fc);--ink:var(--color-text-primary,#0f172a);--muted:var(--color-text-secondary,#526178);--line:var(--color-border-primary,#d8e1ec);--accent:#1d56d8;--focus:#82a7ff;--green:#147547;--green-bg:#e6f6ee;--green-border:#b2e2c9;--amber:#965b06;--amber-bg:#fff4db;--amber-border:#f2d18c;--red:#bd2d42;--red-bg:#fff0f2;--red-border:#f3bcc4;--purple:#6338bd;--purple-bg:#f3eeff;--purple-border:#d6c4fb}
*{box-sizing:border-box}body{font:14px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;margin:0;padding:20px;background:var(--surface);color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}.card{max-width:960px;margin:auto}header{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}.brand{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:10px;background:#1d56d814;color:var(--accent);font:700 18px ui-monospace,monospace}.heading{flex:1;min-width:0}.eyebrow{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;margin:0 0 3px;text-transform:uppercase}h2{font-size:19px;line-height:1.35;letter-spacing:-.03em;margin:0}.intro{color:var(--muted);margin:4px 0 0;font-size:12.5px}
.status,.badge{display:inline-flex;align-items:center;gap:6px;flex:none;border:1px solid var(--line);border-radius:999px;background:var(--soft);padding:5px 11px;margin:0;font-size:12px;font-weight:650;white-space:nowrap}.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status[data-state=pending]{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-border)}.status[data-state=evaluating]{color:var(--purple);background:var(--purple-bg);border-color:var(--purple-border)}.status[data-state=queued],.status[data-state=running]{color:var(--accent);background:#edf4ff;border-color:#caddff}.status[data-state=completed]{color:var(--green);background:var(--green-bg);border-color:var(--green-border)}.status[data-state=failed],.status[data-state=denied]{color:var(--red);background:var(--red-bg);border-color:var(--red-border)}.status[data-state=expired]{color:var(--muted);background:var(--soft);border-color:var(--line)}.status[data-state=unknown]{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-border)}.automatic-approval{margin:0 0 10px;color:var(--accent);border-color:#caddff;background:#edf4ff}
#details{min-width:0}#details>p{overflow-wrap:anywhere}.server-identity{font:600 12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);margin:0 0 6px}.request-meta{font-size:12.5px;color:var(--muted);margin:10px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}.request-meta p{margin:4px 0}.request-meta .request-id{font:11.5px/1.5 ui-monospace,monospace}.request-meta summary{cursor:pointer;margin-top:6px;font-weight:650;color:var(--ink)}.section-label{font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 6px}pre{font:12.5px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}.operation-fields{display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px 12px;margin:0;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:12.5px}.operation-fields dt{color:var(--muted);font-weight:600}.operation-fields dd{margin:0;overflow-wrap:anywhere}.operation-fields .hash{font:11.5px/1.7 ui-monospace,monospace}
#controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:9px 16px;font-size:13.5px;font-weight:650;min-height:44px;transition:background .15s,border-color .15s,box-shadow .15s}#controls button:first-child{background:var(--accent);border-color:var(--accent);color:#fff}button:hover:not(:disabled){border-color:var(--accent);box-shadow:0 2px 8px #1d56d81a}button:active:not(:disabled){transform:translateY(1px)}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}label{display:block;margin:12px 0;color:var(--muted);font-size:12.5px;font-weight:600}input[type=text],select{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:14px;min-height:42px}input[type=checkbox]{accent-color:var(--accent);margin-right:6px;width:16px;height:16px;vertical-align:middle}input[type=file]{display:block;width:100%;padding:12px;border:1px dashed var(--line);border-radius:10px;background:var(--soft);font-size:12.5px}input[type=file]::file-selector-button{border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);padding:7px 11px;margin-right:10px;font:inherit;font-weight:600;cursor:pointer}
#error{color:var(--color-text-danger,var(--red));background:var(--red-bg);border:1px solid var(--red-border);border-left:4px solid var(--red);border-radius:10px;padding:10px 13px;font-size:12.5px;font-weight:600;overflow-wrap:anywhere}#error:empty{display:none}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:14px;margin-top:20px}footer p{font-size:11.5px;color:var(--muted);margin:0}#web{border:0;background:transparent;color:var(--accent);font-size:12.5px;font-weight:650;min-height:36px;padding:5px 8px;white-space:nowrap}
:root[data-theme=dark]{--surface:var(--color-background-primary,#141b26);--soft:var(--color-background-secondary,#1c2536);--ink:var(--color-text-primary,#e7edf8);--muted:var(--color-text-secondary,#9fb0c9);--line:var(--color-border-primary,#2c384e);--green:#6fd9a4;--green-bg:#163328;--green-border:#275944;--amber:#f5c469;--amber-bg:#382c18;--amber-border:#664f27;--red:#ff96a4;--red-bg:#3b2029;--red-border:#6e3848;--purple:#c3a6ff;--purple-bg:#2a2042;--purple-border:#4c3878}:root[data-theme=dark] .status[data-state=queued],:root[data-theme=dark] .status[data-state=running],:root[data-theme=dark] .automatic-approval{color:#9bb8ff;background:#1e2f4d;border-color:#365581}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--surface:var(--color-background-primary,#141b26);--soft:var(--color-background-secondary,#1c2536);--ink:var(--color-text-primary,#e7edf8);--muted:var(--color-text-secondary,#9fb0c9);--line:var(--color-border-primary,#2c384e);--green:#6fd9a4;--green-bg:#163328;--green-border:#275944;--amber:#f5c469;--amber-bg:#382c18;--amber-border:#664f27;--red:#ff96a4;--red-bg:#3b2029;--red-border:#6e3848;--purple:#c3a6ff;--purple-bg:#2a2042;--purple-border:#4c3878}:root:not([data-theme=light]) .status[data-state=queued],:root:not([data-theme=light]) .status[data-state=running],:root:not([data-theme=light]) .automatic-approval{color:#9bb8ff;background:#1e2f4d;border-color:#365581}}
@media(max-width:520px){body{padding:16px}header{flex-wrap:wrap;gap:10px;margin-bottom:16px}.heading{flex:1 1 calc(100% - 52px)}h2{font-size:17px}.status{margin-left:52px}.operation-fields{grid-template-columns:80px minmax(0,1fr)}footer{align-items:flex-start;flex-direction:column;gap:6px}#controls button{flex:1}}
.assessment-summary{margin:14px 0;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--soft)}.assessment-summary strong,.assessment-summary small{display:block}.assessment-summary p{margin:6px 0 0}.assessment-summary small{color:var(--muted);margin-top:5px}.assessment-details{margin:12px 0}.assessment-details>summary{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-weight:650;cursor:pointer;list-style:none}.assessment-details>summary::-webkit-details-marker{display:none}.assessment-details>summary::after{content:'＋';color:var(--accent);font-weight:700}.assessment-details[open]>summary::after{content:'−'}.assessment-body{padding:8px 14px 12px;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;background:var(--soft)}.assessment-body p{margin:10px 0}.assessment-body small{color:var(--muted)}.assessment-scores{display:grid;grid-template-columns:1fr auto;gap:7px 16px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.assessment-scores dt{margin:0}.assessment-scores dd{margin:0;font-variant-numeric:tabular-nums;font-weight:700}
</style></head><body><main class="card"><header><div class="brand" aria-hidden="true">›_</div><div class="heading"><p class="eyebrow">SSH Approval Portal</p><h2 data-en="SSH approval and file transfer">SSH 승인 및 파일 전송</h2><p class="intro" data-en="Review the details. Each approved request runs once.">내용을 확인하고 승인하면 한 번 실행됩니다.</p></div><p id="status" class="status" role="status" data-en="Connecting…">연결 중…</p></header><section id="details" aria-label="요청 내용"></section><div id="controls"></div><p id="error" role="alert"></p><footer><p data-en="Commands and files are processed exactly as approved.">명령과 파일은 승인한 내용으로 처리됩니다.</p><button id="web" data-en="Open web approvals ↗">웹 승인 화면 열기 ↗</button></footer></main><!-- SCRIPT --></body></html>
