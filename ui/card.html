<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSH 승인 및 파일 전송</title><style>
:root{color-scheme:light dark;--surface:var(--color-background-primary,#fff);--soft:var(--color-background-secondary,#f6f8fb);--ink:var(--color-text-primary,#17243b);--muted:var(--color-text-secondary,#66758b);--line:var(--color-border-primary,#e3e8f0);--accent:#2563eb;--focus:#93b4ff}
*{box-sizing:border-box}body{font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:20px;background:var(--surface);color:var(--ink)}.card{max-width:960px;margin:auto}header{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}.brand{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;background:#2563eb12;color:var(--accent);font:700 18px ui-monospace,monospace}.heading{flex:1;min-width:0}.eyebrow{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;margin:0 0 3px}h2{font-size:19px;line-height:1.4;letter-spacing:-.03em;margin:0}.intro{color:var(--muted);margin:5px 0 0;font-size:12px}
.status{display:inline-flex;align-items:center;gap:6px;flex:none;border:1px solid var(--line);border-radius:999px;background:var(--soft);padding:5px 10px;margin:0;font-size:12px;font-weight:650;white-space:nowrap}.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status[data-state=pending]{color:#946600;background:#fef7e2;border-color:#f3df9f}.status[data-state=running]{color:#1d4ed8;background:#edf4ff;border-color:#caddff}.status[data-state=completed]{color:#087b54;background:#eaf8f1;border-color:#bde8d4}.status[data-state=failed],.status[data-state=denied]{color:#b33b47;background:#fff0f1;border-color:#f1c7cd}
#details{min-width:0}#details>p{overflow-wrap:anywhere}.request-meta{font-size:12px;color:var(--muted);margin:0 0 12px}.request-meta .request-id{font-size:11px}.request-meta summary{cursor:pointer;margin-top:6px}.section-label{font-size:12px;font-weight:650;color:var(--muted);margin:18px 0 7px}pre{font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.operation-fields{display:grid;grid-template-columns:95px minmax(0,1fr);gap:8px 12px;margin:0;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:12px}.operation-fields dt{color:var(--muted)}.operation-fields dd{margin:0;overflow-wrap:anywhere}.operation-fields .hash{font:11px/1.7 ui-monospace,monospace}
#controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);padding:9px 15px;font-size:13px;font-weight:600;min-height:40px}#controls button:first-child{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}label{display:block;margin:12px 0;color:var(--muted);font-size:12px}input[type=text]{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-size:14px}input[type=checkbox]{accent-color:var(--accent);margin-right:6px}input[type=file]{display:block;width:100%;padding:12px;border:1px dashed var(--line);border-radius:9px;background:var(--soft);font-size:12px}input[type=file]::file-selector-button{border:0;border-radius:6px;background:var(--surface);color:var(--ink);padding:7px 10px;margin-right:10px;font:inherit;cursor:pointer}
#error{color:var(--color-text-danger,#b33b47);background:#b33b470b;border-radius:9px;padding:10px 12px;font-size:12px;overflow-wrap:anywhere}#error:empty{display:none}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:14px;margin-top:20px}footer p{font-size:11px;color:var(--muted);margin:0}#web{border:0;background:transparent;color:var(--muted);font-size:12px;min-height:32px;padding:5px 0;white-space:nowrap}
:root[data-theme=dark]{--surface:var(--color-background-primary,#171b24);--soft:var(--color-background-secondary,#202633);--ink:var(--color-text-primary,#e5ebf5);--muted:var(--color-text-secondary,#a3afc3);--line:var(--color-border-primary,#333d4f)}:root[data-theme=dark] .status[data-state=pending]{color:#f4d27b;background:#3c321d;border-color:#665426}:root[data-theme=dark] .status[data-state=running]{color:#a4c4ff;background:#203553;border-color:#365581}:root[data-theme=dark] .status[data-state=completed]{color:#88ddb7;background:#19392f;border-color:#315e4f}:root[data-theme=dark] .status[data-state=failed],:root[data-theme=dark] .status[data-state=denied]{color:#f3a2ac;background:#3f252b;border-color:#75414b}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--surface:var(--color-background-primary,#171b24);--soft:var(--color-background-secondary,#202633);--ink:var(--color-text-primary,#e5ebf5);--muted:var(--color-text-secondary,#a3afc3);--line:var(--color-border-primary,#333d4f)}}
@media(max-width:520px){body{padding:16px}header{flex-wrap:wrap;gap:10px;margin-bottom:16px}h2{font-size:17px}.status{margin-left:50px}.operation-fields{grid-template-columns:75px minmax(0,1fr)}footer{align-items:flex-start;flex-direction:column;gap:5px}#controls button{flex:1}}
</style></head><body><main class="card"><header><div class="brand" aria-hidden="true">›_</div><div class="heading"><p class="eyebrow">SSH Approval Portal</p><h2>SSH 승인 및 파일 전송</h2><p class="intro">내용을 확인하고 승인하면 한 번 실행됩니다.</p></div><p id="status" class="status" role="status">연결 중…</p></header><section id="details" aria-label="요청 내용"></section><div id="controls"></div><p id="error" role="alert"></p><footer><p>명령과 파일은 승인한 내용으로 처리됩니다.</p><button id="web">웹 승인 화면 열기 ↗</button></footer></main><!-- SCRIPT --></body></html>
