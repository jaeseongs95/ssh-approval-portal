version=3.0.0
# Versions of the two BOMs every module is built against (dependency versions are the BOMs' business; build files name only what no BOM manages).
springBootVersion=4.1.2
springAiVersion=2.0.2
org.gradle.daemon=false
# The JVM that runs the build has a stated heap (Gradle's own defaults, written down so that a change of Gradle's default does not change a build's memory):
# https://docs.gradle.org/current/userguide/build_environment.html
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m
