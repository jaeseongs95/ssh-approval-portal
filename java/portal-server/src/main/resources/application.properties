# Where Flyway finds the migration scripts of portal-store: the scripts common to every database, and the scripts of the database in use ({vendor} is h2, postgresql,
# mariadb or mysql; the long-text columns have no common type, so they are added by the script of the vendor).
# The default location classpath:db/migration would read every folder below it, so the scripts of all vendors at once, and fail with "Found more than one
# migration with version 1.1". https://docs.spring.io/spring-boot/how-to/data-initialization.html, "Execute Flyway Database Migrations on Startup".
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
